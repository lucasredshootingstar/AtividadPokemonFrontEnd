
<div class="container">

  <header class="header">
    <h1>Pokédex</h1>
    <p>Explore os primeiros Pokémon!</p>
  </header>

  <p *ngIf="carregando">Carregando Pokémon...</p>

  <p *ngIf="erro">{{ erro }}</p>

  <div class="pokemon-grid" *ngIf="!carregando && !erro">

    <a
      class="pokemon-card"
      *ngFor="let pokemon of pokemons"
      [routerLink]="['/pokemon', pokemon.id]"
    >

      <span class="pokemon-id">
        #{{ pokemon.id }}
      </span>

      <img
        [src]="pokemon.imagem"
        [alt]="pokemon.nome"
      >

      <h2>{{ pokemon.nome | titlecase }}</h2>

    </a>

  </div>

</div>
